name: Release

# Builds the distributable artifacts and publishes a GitHub Release whenever a
# version tag (vX.Y.Z) is pushed:
#   - Windows:  PrivacyFilter-Setup-vX.Y.Z.exe  (self-extracting launcher)
#   - Linux:    PrivacyFilter-linux-vX.Y.Z.tar.gz          (extract + ./run.sh)
#   - macOS:    PrivacyFilter-macos-arm64-vX.Y.Z.tar.gz    (extract + double-click run.command)
# Can also be run manually (workflow_dispatch) with an explicit version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 2.4.0)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install NSIS
        continue-on-error: true
        run: choco install nsis -y --no-progress
      - name: Build portable package
        shell: powershell
        run: .\build_portable.ps1 -RebuildFrontend
      - name: Build self-extracting .exe
        shell: powershell
        run: .\packaging\windows\make_exe.ps1 -Version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ubuntu-latest ships a global pnpm that can differ from the pinned
      # packageManager in frontend/package.json. action-setup reads that field
      # and installs the matching version, and runs BEFORE setup-node (v5
      # validates the package manager and fails if pnpm is not yet on PATH),
      # so pnpm runs cleanly. The version lives in package.json only.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build frontend
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend run build
      - name: Assemble Linux tarball
        run: |
          VER="${{ needs.version.outputs.version }}"
          STAGE="PrivacyFilter-linux-v$VER"
          mkdir -p "$STAGE/frontend"
          cp -r server privacy-filter app_update.py model_update.py \
                requirements-server.txt VERSION "$STAGE"/
          cp -r frontend/dist "$STAGE/frontend/dist"
          cp packaging/linux/run.sh "$STAGE/run.sh"
          chmod +x "$STAGE/run.sh"
          # Strip build noise from the bundled opf package copy.
          find "$STAGE" -name '__pycache__' -type d -prune -exec rm -rf {} +
          rm -rf "$STAGE/privacy-filter/.git" "$STAGE/privacy-filter/build" \
                 "$STAGE/privacy-filter/opf.egg-info"
          tar -czf "$STAGE.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-tarball
          path: PrivacyFilter-linux-*.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    # macos-14 is the Apple Silicon (arm64) runner. macos-13 would be Intel;
    # we ship arm64 only for now (per the firm's hardware).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build frontend
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend run build
      - name: Assemble macOS tarball
        run: |
          VER="${{ needs.version.outputs.version }}"
          STAGE="PrivacyFilter-macos-arm64-v$VER"
          mkdir -p "$STAGE/frontend"
          cp -r server privacy-filter app_update.py model_update.py \
                requirements-server.txt VERSION "$STAGE"/
          cp -r frontend/dist "$STAGE/frontend/dist"
          cp packaging/macos/run.command "$STAGE/run.command"
          chmod +x "$STAGE/run.command"
          # Strip build noise from the bundled opf package copy.
          find "$STAGE" -name '__pycache__' -type d -prune -exec rm -rf {} +
          rm -rf "$STAGE/privacy-filter/.git" "$STAGE/privacy-filter/build" \
                 "$STAGE/privacy-filter/opf.egg-info"
          tar -czf "$STAGE.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-tarball
          path: PrivacyFilter-macos-arm64-*.tar.gz
          if-no-files-found: error

  # Proves, on each platform we publish, that a shipped environment can find a
  # person's name. Releases up to 2.6.3 could not: the spaCy models were only
  # mentioned in a comment in requirements-server.txt, so nothing installed
  # them and every name written in caps came back unredacted while DNIs and
  # addresses were replaced — an output that looks anonymised and is not.
  #
  # It runs the real first-run path (server/ner_models downloads ~1.2 GB), which
  # is why it lives here and not in tests.yml: the unit tests are offline and
  # skip precisely when the models are absent, which is the broken state.
  # torch is not installed on purpose — the NER layer does not need it, and the
  # opf checkpoint is 2.7 GB we do not have to move to answer this question.
  smoke:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements-server.txt
      - name: Detect a name written in caps
        run: python smoke_ner.py

  release:
    needs: [version, windows, linux, macos, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Build release notes
        shell: bash
        run: |
          VER="${{ needs.version.outputs.version }}"
          python3 - "$VER" > notes.md <<'PY'
          import re, sys, pathlib
          ver = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"## \[{re.escape(ver)}\].*?(?=## \[|\Z)", text, re.DOTALL)
          print(m.group(0).strip() if m else f"Release v{ver}.")
          PY
          {
            echo ""
            echo "## Downloads"
            echo "- **Windows:** \`PrivacyFilter-Setup-v${VER}.exe\` — double-click; it extracts into a \`PrivacyFilter\` folder next to the .exe and starts automatically. The first run downloads the model (~2.7 GB)."
            echo "- **Linux (technical users):** \`PrivacyFilter-linux-v${VER}.tar.gz\` — extract and run \`./run.sh\` (creates a virtualenv on first run)."
            echo "- **macOS (Apple Silicon):** \`PrivacyFilter-macos-arm64-v${VER}.tar.gz\` — extract, then double-click \`run.command\`. First time: right-click → Open → Open to bypass Gatekeeper. First run creates a virtualenv."
          } >> notes.md
      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: |
            artifacts/windows-exe/*.exe
            artifacts/linux-tarball/*.tar.gz
            artifacts/macos-tarball/*.tar.gz

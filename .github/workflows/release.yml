name: Release

# Builds the Windows installer and publishes a GitHub Release whenever a
# version tag (vX.Y.Z) is pushed:
#   - Windows:  PrivacyFilter-Setup-vX.Y.Z.exe  (self-extracting launcher)
# The app is only deployed on Windows, so the macOS and Linux tarballs are no
# longer built: a retired macOS runner was enough to block a Windows release.
# The launchers in packaging/macos and packaging/linux still work from a
# checkout.
# Can also be run manually (workflow_dispatch) with an explicit version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 2.4.0)"
        required: true

permissions:
  contents: write

# Pinned so a build is reproducible and a bad upstream release cannot silently
# change what ships.
env:
  # Language data for the bundled Tesseract. tessdata_fast is a few MB per
  # language against ~15 MB for tessdata_best, with no visible difference on
  # 300-dpi administrative scans. The set matches PF_OCR_LANG in
  # server/pdf_ops.py.
  TESSDATA_TAG: "4.1.0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install NSIS
        continue-on-error: true
        run: choco install nsis -y --no-progress
      - name: Build portable package
        shell: powershell
        run: .\build_portable.ps1 -RebuildFrontend
      - name: Build self-extracting .exe
        shell: powershell
        run: .\packaging\windows\make_exe.ps1 -Version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error
      # Uploaded on its own because the release artifact is a self-extracting
      # installer: the smoke job cannot look inside it, and running the OCR
      # check against some other Tesseract would prove nothing.
      - uses: actions/upload-artifact@v6
        with:
          name: windows-tesseract
          path: portable-build/tesseract
          if-no-files-found: error

  # Proves, on the platform we publish, that a shipped environment can find a
  # person's name. Releases up to 2.6.3 could not: the spaCy models were only
  # mentioned in a comment in requirements-server.txt, so nothing installed
  # them and every name written in caps came back unredacted while DNIs and
  # addresses were replaced — an output that looks anonymised and is not.
  #
  # It runs the real first-run path (server/ner_models downloads ~1.2 GB), which
  # is why it lives here and not in tests.yml: the unit tests are offline and
  # skip precisely when the models are absent, which is the broken state.
  # torch is not installed on purpose — the NER layer does not need it, and the
  # opf checkpoint is 2.7 GB we do not have to move to answer this question.
  smoke:
    needs: [version, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements-server.txt
      - name: Detect a name written in caps
        run: python smoke_ner.py
      # The OCR half, against the Tesseract that actually ships. The release
      # artifact is an installer the job cannot look inside, so the windows job
      # uploads the bundled Tesseract folder separately.
      - uses: actions/download-artifact@v7
        with:
          name: windows-tesseract
          path: artifact
      # PowerShell so the paths handed to tesseract.exe are Windows paths; git
      # bash would produce /d/a/... which the binary cannot open.
      - name: Read a page that has no text layer
        shell: powershell
        run: |
          $tess = Join-Path $PWD "artifact"
          $env:PATH = (Join-Path $tess "bin") + ";" + $env:PATH
          $env:PF_TESSDATA_DIR = Join-Path $tess "tessdata"
          python smoke_ocr.py

  release:
    needs: [version, windows, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: windows-exe
          path: artifacts/windows-exe
      - name: Build release notes
        shell: bash
        run: |
          VER="${{ needs.version.outputs.version }}"
          python3 - "$VER" > notes.md <<'PY'
          import re, sys, pathlib
          ver = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"## \[{re.escape(ver)}\].*?(?=## \[|\Z)", text, re.DOTALL)
          print(m.group(0).strip() if m else f"Release v{ver}.")
          PY
          {
            echo ""
            echo "## Downloads"
            echo "- **Windows:** \`PrivacyFilter-Setup-v${VER}.exe\` — double-click; it extracts into a \`PrivacyFilter\` folder next to the .exe and starts automatically. The first run downloads the model (~2.7 GB) and loads it before the app opens."
          } >> notes.md
      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: |
            artifacts/windows-exe/*.exe

name: Tests

# Runs the backend test suite and the frontend typecheck/build on every push
# and pull request, so a broken commit is caught before it reaches `main`
# instead of only at release-tag time (.github/workflows/release.yml).

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ./privacy-filter
          pip install -r requirements-server.txt
          pip install -r requirements-dev.txt
      # build_portable.ps1 and the packaging scripts are the only files nothing
      # executes until a release build runs on Windows, ten minutes in. pwsh is
      # preinstalled on the Ubuntu runners, so parsing them here costs seconds
      # and catches a typo before it costs a release.
      - name: Parse the PowerShell packaging scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('build_portable.ps1', 'packaging/windows/make_exe.ps1')) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  Write-Host "::error file=$file::$($errors.Count) parse error(s)"
                  $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
                  $failed = $true
              } else {
                  Write-Host "OK $file"
              }
          }
          if ($failed) { exit 1 }
      - name: Run tests
        # PF_FAST_MOE=0: server/moe_fast.py's "auto" mode times two CPU
        # implementations and caches the winner per host, but that cache lives
        # under the model checkpoint dir — on a fresh, ephemeral CI runner
        # there's never a cache hit, so every run pays for the real
        # micro-benchmark. That's what killed the first run of this workflow
        # (job canceled ~44s into tests/test_moe_fast.py::test_install_is_idempotent).
        # The module documents this exact escape hatch; the two tests that
        # assert on the benchmark's outcome already skip without the checkpoint
        # (never downloaded in CI), so this only affects install() plumbing tests.
        run: python -m pytest tests/ -v
        env:
          PF_FAST_MOE: "0"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile
      - name: Lint
        run: pnpm -C frontend run lint
      - name: Typecheck
        run: pnpm -C frontend run typecheck
      - name: Test
        run: pnpm -C frontend run test
      - name: Build
        run: pnpm -C frontend run build
